name: daily-predict

# ローカルPCのタスクスケジューラ(Windows)がログイン中セッション必須/PCスリープで
# 何度も止まったため、GitHub Actionsに移行した(2026-09-04)。
#
# GitHub ActionsのランナーはREADME実行ごとに使い捨てで前回の状態を引き継がないため、
# SQLite DB(data/boatrace.db)はリポジトリにコミットせず、GitHub Releaseの
# "db-latest" タグにアセットとして置いて、実行のたびにダウンロード→更新→
# アップロードする(release-basedの簡易永続化。DBは頻繁に更新されるので
# git履歴に残すとリポジトリが際限なく肥大化するため)。

on:
  schedule:
    # UTC 0:00〜12:30 = JST 9:00〜21:30、30分おき。GitHub Actionsのcronは
    # 数分〜まれに10分以上遅延することがある(仕様上の制約、確実な時刻起動は保証されない)。
    - cron: "0,30 0-12 * * *"
  workflow_dispatch: {}  # 手動実行用(GitHubのActionsタブから "Run workflow" で起動できる)

permissions:
  contents: write  # gh release upload に必要

concurrency:
  group: daily-predict
  cancel-in-progress: false  # 前回の実行がまだ終わっていなければ待つ(DBの取り合いを避ける)

jobs:
  predict:
    runs-on: ubuntu-latest
    # daily_predict.py内部で最大18分ポーリングするため、セットアップ分の余裕を見て30分にする
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      # PLAYWRIGHT_BROWSERS_PATH=0(パッケージ内固定パス)はWindowsタスクスケジューラ
      # 実行時だけ%LOCALAPPDATA%解決が不安定だった問題への対処だった(ローカル運用時のみ
      # の問題)。GitHub ActionsのUbuntuランナーはクリーンな使い捨て環境なのでその問題が
      # 起きず、代わりにデフォルトのキャッシュパス(~/.cache/ms-playwright)をそのまま
      # actions/cacheで使い回した方が実行時間を大きく短縮できる(毎回ゼロから
      # ダウンロード/インストールしていたのが実行時間の大半を占めていたため)。
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright OS dependencies only
        run: python -m playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Download latest DB snapshot
        run: |
          mkdir -p data
          gh release download db-latest --repo "${{ github.repository }}" \
            --pattern boatrace.db --output data/boatrace.db --clobber

      - name: Run daily_predict.py
        run: python scripts/daily_predict.py

      - name: Upload updated DB snapshot
        if: always()  # 途中で失敗しても、そこまでの進捗は保存しておく
        run: |
          gh release upload db-latest data/boatrace.db --repo "${{ github.repository }}" --clobber
