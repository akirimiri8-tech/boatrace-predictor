name: probe-exacta
# 一時的な確認用: クラウドの実行環境から公式サイトの2連単オッズページが取れるか
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "boatrace-research-personal/1.0" "Mozilla/5.0"; do
            curl -s -A "$ua" "https://www.boatrace.jp/owpc/pc/race/odds2tf?rno=12&jcd=04&hd=$(TZ=Asia/Tokyo date +%Y%m%d)" -o o.html -w "UA=$ua code=%{http_code} size=%{size_download}\n"
            echo "oddsPoint=$(grep -c oddsPoint o.html)"; head -c 300 o.html; echo
          done
          curl -s -A "Mozilla/5.0" "https://www.boatrace.jp/owpc/pc/race/oddstf?rno=12&jcd=04&hd=$(TZ=Asia/Tokyo date +%Y%m%d)" -o w.html -w "oddstf code=%{http_code} size=%{size_download}\n"
